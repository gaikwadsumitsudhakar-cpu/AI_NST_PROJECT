<style>
/* STYLEFORGE AI — CLASSIC PREMIUM THEME */
:root {
  --sf-bg: #F5F3EE;
  --sf-surface: #FFFFFF;
  --sf-ink: #17243A;
  --sf-muted: #667085;
  --sf-border: #E3E5E8;
  --sf-accent: #397C78;
  --sf-accent-dark: #28625F;
  --sf-soft: #EDF5F3;
  --sf-gold: #C5A46D;
  --sf-shadow: 0 18px 48px rgba(23, 36, 58, 0.08);
}

html {
  scroll-behavior: smooth;
}

body {
  font-family: 'Inter', 'Segoe UI', sans-serif !important;
  background: var(--sf-bg) !important;
  background-image: none !important;
  color: var(--sf-ink) !important;
  min-height: 100vh;
  line-height: 1.65;
}

#neuralCanvas,
.scanlines,
.orb {
  display: none !important;
}

/* Navigation */
.navbar {
  position: sticky !important;
  background: rgba(255, 255, 255, 0.96) !important;
  backdrop-filter: blur(16px);
  border-bottom: 1px solid var(--sf-border) !important;
  box-shadow: 0 4px 20px rgba(23, 36, 58, 0.035);
  padding: 0.8rem 0;
}

.navbar-brand {
  font-family: 'Inter', sans-serif !important;
  font-size: 1.3rem !important;
  font-weight: 800 !important;
  letter-spacing: -0.045em;
  background: none !important;
  -webkit-text-fill-color: var(--sf-ink) !important;
  color: var(--sf-ink) !important;
}

.navbar-brand i {
  color: var(--sf-accent);
}

.nav-link {
  color: #475467 !important;
  font-size: 0.92rem;
  font-weight: 600 !important;
  margin: 0 0.25rem !important;
}

.nav-link:hover {
  color: var(--sf-accent) !important;
}

.nav-link::after {
  background: var(--sf-accent) !important;
}

.navbar .btn-outline-light {
  color: var(--sf-ink) !important;
  border-color: #D4D8DC !important;
  font-weight: 600;
}

/* Hero Section */
.header-section {
  padding: 4.6rem 0 2.6rem !important;
  text-align: left !important;
}

.header-section .container {
  max-width: 1120px;
}

.header-section h1 {
  font-family: 'Inter', sans-serif !important;
  font-size: clamp(2.35rem, 5vw, 3.7rem) !important;
  line-height: 1.1;
  letter-spacing: -0.065em;
  font-weight: 800 !important;
  background: none !important;
  -webkit-text-fill-color: var(--sf-ink) !important;
  color: var(--sf-ink) !important;
  text-shadow: none !important;
  margin-bottom: 1rem !important;
}

.header-section .lead {
  display: block !important;
  width: auto !important;
  max-width: 650px !important;
  white-space: normal !important;
  overflow: visible !important;
  border: 0 !important;
  animation: none !important;
  color: var(--sf-muted) !important;
  font-size: 1.08rem !important;
  margin: 0 !important;
}

.container {
  max-width: 1120px;
}

/* Premium Cards */
.card {
  background: var(--sf-surface) !important;
  backdrop-filter: none !important;
  border: 1px solid var(--sf-border) !important;
  border-radius: 20px !important;
  box-shadow: var(--sf-shadow) !important;
  overflow: hidden;
  transition: transform 0.25s ease, box-shadow 0.25s ease;
}

.card:hover {
  transform: translateY(-3px);
  box-shadow: 0 24px 55px rgba(23, 36, 58, 0.11) !important;
  border-color: #CDDAD7 !important;
}

.card-header {
  background: #FFFFFF !important;
  border-bottom: 1px solid var(--sf-border) !important;
  color: var(--sf-ink) !important;
  font-family: 'Inter', sans-serif !important;
  font-weight: 700;
  font-size: 0.95rem;
  letter-spacing: 0.025em;
  text-transform: none !important;
  padding: 1.15rem 1.5rem !important;
}

.card-body {
  padding: 1.5rem !important;
}

.card-footer {
  background: #FFFFFF !important;
  border-top: 1px solid var(--sf-border) !important;
}

/* Image Preview */
.preview-image {
  width: 100%;
  height: 300px;
  object-fit: contain;
  background: #F8F9FA !important;
  border: 1.5px dashed #CBD5D8 !important;
  border-radius: 14px !important;
  display: flex;
  align-items: center;
  justify-content: center;
  color: var(--sf-muted) !important;
  font-size: 1rem;
  overflow: hidden;
  transition: border-color 0.25s, background 0.25s;
}

.preview-image:hover {
  border-color: var(--sf-accent) !important;
  background: var(--sf-soft) !important;
}

.preview-image img {
  width: 100%;
  height: 100%;
  object-fit: contain;
}

/* Upload Controls */
.form-control {
  background-color: #FFFFFF !important;
  border: 1px solid #D7DCE1 !important;
  color: var(--sf-ink) !important;
  border-radius: 10px !important;
  padding: 0.8rem !important;
  font-size: 0.92rem;
}

.form-control:focus {
  background-color: #FFFFFF !important;
  border-color: var(--sf-accent) !important;
  color: var(--sf-ink) !important;
  box-shadow: 0 0 0 4px rgba(57, 124, 120, 0.12) !important;
}

.form-control::file-selector-button {
  background: var(--sf-soft) !important;
  color: var(--sf-accent-dark) !important;
  border: 0 !important;
  padding: 0.55rem 0.9rem !important;
  margin-right: 0.8rem !important;
  border-radius: 7px !important;
  font-weight: 600;
  cursor: pointer;
}

.form-control::file-selector-button:hover {
  background: #DCECE8 !important;
}

/* Primary Button */
.btn-primary {
  background: var(--sf-accent) !important;
  border: 1px solid var(--sf-accent) !important;
  color: #FFFFFF !important;
  padding: 14px 36px !important;
  font-family: 'Inter', sans-serif !important;
  font-size: 1rem !important;
  font-weight: 700 !important;
  border-radius: 12px !important;
  letter-spacing: 0 !important;
  text-transform: none !important;
  box-shadow: 0 6px 16px rgba(57, 124, 120, 0.18) !important;
  transition: all 0.25s ease;
}

.btn-primary:hover {
  background: var(--sf-accent-dark) !important;
  border-color: var(--sf-accent-dark) !important;
  transform: translateY(-2px);
  box-shadow: 0 10px 24px rgba(57, 124, 120, 0.24) !important;
}

.btn-glow {
  animation: none !important;
}

/* Style Strength Slider */
.range-wrap {
  position: relative;
  margin: 2.5rem auto;
  width: 100%;
  max-width: 90%;
}

.range-wrap label {
  color: var(--sf-ink) !important;
  font-family: 'Inter', sans-serif !important;
  font-size: 0.95rem;
  font-weight: 700;
  letter-spacing: 0.04em;
}

#alphaRange {
  appearance: none;
  -webkit-appearance: none;
  width: 100%;
  height: 7px;
  background: #E1E6E8;
  border-radius: 20px;
  outline: none;
  border: none;
  box-shadow: none;
}

#alphaRange::-webkit-slider-runnable-track {
  height: 7px;
  border-radius: 20px;
  cursor: pointer;
}

#alphaRange::-webkit-slider-thumb {
  appearance: none;
  -webkit-appearance: none;
  width: 21px;
  height: 21px;
  margin-top: -7px;
  border-radius: 50%;
  background: var(--sf-accent);
  border: 4px solid #FFFFFF;
  box-shadow: 0 0 0 1px var(--sf-accent);
  cursor: pointer;
  transition: transform 0.2s;
}

#alphaRange::-webkit-slider-thumb:hover {
  transform: scale(1.12);
}

#alphaRange::-moz-range-thumb {
  width: 15px;
  height: 15px;
  border-radius: 50%;
  background: var(--sf-accent);
  border: 3px solid #FFFFFF;
  box-shadow: 0 0 0 1px var(--sf-accent);
  cursor: pointer;
}

.range-value {
  position: absolute;
  top: -42px;
  left: 50%;
  transform: translateX(-50%);
  background: var(--sf-ink) !important;
  color: #FFFFFF !important;
  padding: 4px 11px;
  border-radius: 7px;
  font-family: 'Inter', sans-serif !important;
  font-size: 0.8rem;
  font-weight: 700;
  box-shadow: none !important;
  opacity: 0;
  transition: opacity 0.2s;
  pointer-events: none;
}

.range-value::after {
  content: '';
  position: absolute;
  bottom: -5px;
  left: 50%;
  margin-left: -5px;
  border-width: 5px 5px 0;
  border-style: solid;
  border-color: var(--sf-ink) transparent transparent transparent;
}

.range-wrap:hover .range-value {
  opacity: 1;
}

/* Result Section */
#resultSection .card {
  border: 1px solid #C9DED9 !important;
}

#resultSection .card-header {
  background: var(--sf-soft) !important;
  color: var(--sf-accent-dark) !important;
  border-bottom: 1px solid #D5E7E2 !important;
  font-weight: 700;
}

#resultSection img {
  background: #F8F9FA;
  object-fit: contain;
  max-height: 650px;
}

.btn-outline-light {
  color: var(--sf-ink) !important;
  border: 1px solid #D5DADF !important;
  background: #FFFFFF !important;
  border-radius: 10px !important;
  font-weight: 600;
  padding: 10px 20px;
}

.btn-outline-light:hover {
  color: var(--sf-accent-dark) !important;
  background: var(--sf-soft) !important;
  border-color: var(--sf-accent) !important;
}

/* Examples */
.examples-section,
.faq-section {
  margin-top: 3.5rem !important;
}

.examples-section .example-flow {
  display: flex;
  align-items: center;
  gap: 1.5rem;
  padding: 1.5rem;
  border-radius: 16px;
  background: #FAFAF8 !important;
  border: 1px solid var(--sf-border) !important;
}

.examples-section .example-role {
  font-size: 0.78rem;
  font-weight: 700;
  letter-spacing: 0.07em;
  color: var(--sf-muted) !important;
  margin-bottom: 0.6rem;
  text-transform: uppercase;
}

.examples-section .example-image {
  width: 100%;
  height: 220px;
  object-fit: contain;
  border-radius: 12px;
  border: 1px solid var(--sf-border) !important;
  background: #FFFFFF !important;
}

.examples-section .example-arrow {
  color: var(--sf-accent);
  font-size: 1.7rem;
  font-weight: 700;
}

/* FAQ */
.faq-section .accordion-item {
  background: #FFFFFF !important;
  border: 1px solid var(--sf-border) !important;
  margin-bottom: 0.8rem;
  border-radius: 12px !important;
  overflow: hidden;
}

.faq-section .accordion-button {
  background: #FFFFFF !important;
  color: var(--sf-ink) !important;
  font-weight: 650;
  box-shadow: none !important;
}

.faq-section .accordion-button:not(.collapsed) {
  background: var(--sf-soft) !important;
  color: var(--sf-accent-dark) !important;
}

.faq-section .accordion-button:focus {
  box-shadow: 0 0 0 3px rgba(57, 124, 120, 0.12) !important;
}

.faq-section .accordion-body {
  color: var(--sf-muted) !important;
  background: #FFFFFF;
}

/* Footer */
.footer-section {
  background: #17243A !important;
  border-top: 0 !important;
  padding: 3.5rem 0 2rem !important;
  margin-top: 5rem !important;
  color: #D0D5DD !important;
}

.footer-section h5 {
  color: #FFFFFF !important;
  font-family: 'Inter', sans-serif !important;
  font-weight: 700;
  letter-spacing: -0.02em;
}

.footer-section p {
  color: #D0D5DD !important;
}

.footer-section .text-muted {
  color: #AEB8C6 !important;
}

.footer-link {
  color: #D0D5DD !important;
  text-decoration: none;
  display: block;
  margin-bottom: 0.75rem;
  transition: color 0.2s;
}

.footer-link:hover {
  color: #8CC4BA !important;
}

.social-icon {
  width: 40px;
  height: 40px;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  background: rgba(255, 255, 255, 0.08) !important;
  border-radius: 12px !important;
  color: #FFFFFF !important;
  margin-right: 10px;
  text-decoration: none;
  transition: all 0.2s;
}

.social-icon:hover {
  background: var(--sf-accent) !important;
  transform: translateY(-2px);
}

.footer-section hr {
  border-color: rgba(255, 255, 255, 0.18) !important;
}

/* Loading Overlay */
.loader-overlay {
  background: rgba(245, 243, 238, 0.96) !important;
  backdrop-filter: blur(8px);
}

.loader-overlay h3 {
  color: var(--sf-ink) !important;
  font-family: 'Inter', sans-serif !important;
  letter-spacing: 0.04em !important;
}

.loader-overlay p {
  color: var(--sf-muted) !important;
}

.cyber-spinner {
  border-top-color: var(--sf-accent) !important;
  border-right-color: var(--sf-gold) !important;
  box-shadow: none !important;
}

/* Scrollbar */
::-webkit-scrollbar {
  width: 9px;
}

::-webkit-scrollbar-track {
  background: var(--sf-bg);
}

::-webkit-scrollbar-thumb {
  background: #C8D0D3;
  border-radius: 20px;
}

::-webkit-scrollbar-thumb:hover {
  background: var(--sf-accent);
}

/* Remove unnecessary effects */
.fade-in-up {
  animation: fadeInUp 0.55s ease-out forwards;
}

@keyframes fadeInUp {
  from {
    opacity: 0;
    transform: translateY(12px);
  }
  to {
    opacity: 1;
    transform: translateY(0);
  }
}

/* Responsive Layout */
@media (max-width: 767.98px) {
  .header-section {
    padding: 3rem 0 2rem !important;
  }

  .header-section h1 {
    font-size: 2.35rem !important;
  }

  .card-body {
    padding: 1.1rem !important;
  }

  .preview-image {
    height: 230px;
  }

  .range-wrap {
    max-width: 100%;
  }

  .btn-primary {
    width: 100%;
    padding: 14px 20px !important;
  }

  .examples-section .example-flow {
    flex-direction: column;
  }

  .examples-section .example-arrow {
    transform: rotate(90deg);
  }

  .footer-section {
    padding: 2.5rem 0 1.5rem !important;
  }
}

@media (prefers-reduced-motion: reduce) {
  *,
  *::before,
  *::after {
    scroll-behavior: auto !important;
    animation-duration: 0.01ms !important;
    transition-duration: 0.01ms !important;
  }
}
</style>
